{{define "layout"}}<!doctype html>
<html>
<head><meta charset="utf-8"><title>Enrollment</title></head>
<body>
<p>
{{if .User}}
  <a href="/courses">Courses</a> |
  <a href="/grades">Grades</a> |
  {{.User.Name}} ({{.User.Role}})
  <form method="post" action="/logout" style="display:inline"><button>Logout</button></form>
{{else}}
  <a href="/login">Login</a>
{{end}}
</p>
<hr>
{{if .Msg}}<p><b>{{.Msg}}</b></p>{{end}}
{{if .Err}}<p style="color:red">{{.Err}}</p>{{end}}
{{template "content" .}}
</body>
</html>{{end}}
