{{define "content"}}
<h1>Login</h1>
{{if .User}}
<p>Already logged in as {{.User.Username}}.</p>
{{else}}
<form method="post" action="/login">
  <p>Username <input name="username" required></p>
  <p>Password <input name="password" type="password" required></p>
  <button>Login</button>
</form>
<p>Demo accounts (password: <code>password</code>): alice, bob (students); prof1, prof2 (faculty)</p>
{{end}}
{{end}}
