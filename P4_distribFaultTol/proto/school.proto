syntax = "proto3";

package school;

option go_package = "p4/proto";

message Empty {}

// ---------- Auth node ----------
service Auth {
  rpc Login(LoginRequest) returns (LoginReply);
  // Uses the JWT sent in the "authorization" metadata.
  rpc Logout(Empty) returns (Empty);
  // Whether a session is still live. The course and grade nodes call this so a
  // logout takes effect on them too; if the auth node is unreachable they let
  // the call through, so logging out is the only thing auth being down breaks.
  rpc SessionStatus(SessionQuery) returns (SessionState);
}

message SessionQuery {
  string jti = 1; // the JWT's token id
}

message SessionState {
  bool revoked = 1; // the user logged out
  bool known = 2;   // false if this auth node has no record of the session
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string token = 1;
  string username = 2;
  string role = 3; // "student", "faculty" or "registrar"
  string name = 4;
}

// ---------- Course node ----------
service Course {
  rpc ListCourses(Empty) returns (CourseList);
  rpc Enroll(EnrollRequest) returns (Empty);
  rpc Drop(EnrollRequest) returns (Empty); // student leaves a course they enrolled in
}

message CourseInfo {
  string code = 1;
  string title = 2;
  string faculty = 3;
  int32 capacity = 4;
  int32 enrolled = 5;
  bool open = 6;
  bool enrolled_by_me = 7;
}

message CourseList { repeated CourseInfo courses = 1; }

message EnrollRequest { string code = 1; }

// ---------- Grade node ----------
service Grade {
  rpc MyGrades(Empty) returns (GradeList);      // student
  rpc UploadedGrades(Empty) returns (GradeList); // faculty: grades they uploaded
  rpc UploadGrade(GradeEntry) returns (Empty);   // faculty
}

message GradeEntry {
  string student = 1;
  string course = 2;
  string term = 3;
  string grade = 4;
  string faculty = 5; // set by the server
}

message GradeList { repeated GradeEntry grades = 1; }


// ---------- Announce node ----------
// Registrar announcements: enrollment schedules per year level, enrollment
// confirmation, payment deadlines. Its own object with its own full CRUD, on
// its own node. Everyone can read (students only see what is addressed to
// their year level); only registrar accounts can create, edit or delete.
service Announce {
  rpc ListAnnouncements(Empty) returns (AnnouncementList);
  rpc GetAnnouncement(AnnouncementId) returns (Announcement);
  rpc CreateAnnouncement(Announcement) returns (Announcement);
  rpc UpdateAnnouncement(Announcement) returns (Announcement); // by id
  rpc DeleteAnnouncement(AnnouncementId) returns (Empty);
}

message Announcement {
  string id = 1;                  // set by the server on create
  string category = 2;            // schedule | confirmation | payment | general
  string title = 3;
  string body = 4;
  repeated int32 year_levels = 5; // empty = everyone; otherwise 1..4
  int64 starts_at = 6;            // unix seconds, 0 = no start
  int64 ends_at = 7;              // unix seconds, 0 = no end (e.g. a deadline)
  bool pinned = 8;
  string author = 9;              // set by the server
  string author_name = 10;        // set by the server
  int64 created_at = 11;          // set by the server
  int64 updated_at = 12;          // set by the server
}

message AnnouncementId { string id = 1; }

message AnnouncementList { repeated Announcement announcements = 1; }
