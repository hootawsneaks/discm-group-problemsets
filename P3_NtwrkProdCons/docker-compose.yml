# Local demo: consumer and producer in separate containers talking over gRPC.
# IP addresses are declared here (not auto-assigned by Docker):
#   consumer = 172.28.0.10, producer = 172.28.0.11 on the p3net subnet.
# Other settings come from ./config.json (mounted, so edits apply on restart without rebuilding).
# For separate VMs, run only one service per VM (see README.md).
services:
  consumer:
    build: .
    command: ["consumer"]
    # Without this, `docker compose stop` waits the default 10s before killing
    # the consumer. Uploads are saved with a temp-file-and-rename, so a stopped
    # consumer never leaves a half-written video in the upload folder.
    stop_grace_period: 2s
    networks:
      p3net:
        ipv4_address: 172.28.0.10
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      # The self-signed certificate lives here, so it survives restarts and the
      # browser exception you accept once keeps working.
      - ./certs:/app/certs

  producer:
    build: .
    command: ["producer"]
    networks:
      p3net:
        ipv4_address: 172.28.0.11
    environment:
      # Overrides consumer_addr in config.json: the consumer's declared IP above.
      CONSUMER_ADDR: "172.28.0.10:50051"
    depends_on: [consumer]
    volumes:
      - ./config.json:/app/config.json:ro
      - ./videos:/app/videos:ro

networks:
  p3net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
